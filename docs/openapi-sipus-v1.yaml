openapi: 3.0.3
info:
  title: SIPUS-Del Perpustakaan Del RESTful Web API & SOAP Legacy Services
  version: 1.0.0
  description: >
    Spesifikasi Kontrak Resmi Web Services Terdistribusi SIPUS-Del (Minggu 9 PPW Institut Teknologi Del).
    Mendukung SOAP 1.1 Legacy untuk Administrasi Bebas Pustaka Yudisium dan RESTful Web API v1
    dengan kepatuhan Richardson Maturity Model Level 3 (HATEOAS) serta penanganan galat standar RFC 7807 (Problem Details).
    Pemilik Sistem: Lucas Pardede (NIM 12S24015), Program Studi Sarjana Sistem Informasi.
servers:
  - url: http://localhost:8000/api/v1
    description: Server Lokal REST API v1
  - url: http://localhost:8000
    description: Server Lokal Basis (SOAP Endpoint)

tags:
  - name: SOAP Legacy
    description: Simulasi Web Service SOAP 1.1 untuk Administrasi Bebas Pustaka Yudisium
  - name: Autentikasi
    description: Manajemen Stateless Bearer Token via Laravel Sanctum
  - name: Katalog Buku
    description: Pengelolaan dan penjelajahan koleksi buku perpustakaan
  - name: Sirkulasi Peminjaman
    description: Transaksi peminjaman dan pengembalian buku bergaransi ACID
  - name: Konsumer Eksternal
    description: Integrasi metadata bibliografi buku eksternal dari OpenLibrary

paths:
  /soap/sipus.wsdl:
    get:
      tags:
        - SOAP Legacy
      summary: Kontrak Formal WSDL 1.1 Layanan Bebas Pustaka
      description: Mengembalikan dokumen XML WSDL 1.1 yang mendefinisikan operasi CheckClearanceStatus.
      responses:
        '200':
          description: Dokumen WSDL berhasil disajikan
          content:
            text/xml; charset=utf-8:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <definitions name="LibrarySoapService" targetNamespace="http://sipus.del.ac.id/soap/clearance" ...>
                    ...
                  </definitions>

  /soap/sipus:
    post:
      tags:
        - SOAP Legacy
      summary: Eksekusi Operasi Pengecekan Bebas Pustaka (CheckClearanceStatus)
      description: Menerima SOAP Envelope XML berisi NIM peminjam dan memeriksa tanggungan buku aktif di basis data.
      requestBody:
        required: true
        content:
          text/xml; charset=utf-8:
            schema:
              type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:m="http://sipus.del.ac.id/soap/clearance">
                  <soap:Body>
                    <m:CheckClearanceStatusRequest>
                      <m:nim_peminjam>12S24015</m:nim_peminjam>
                    </m:CheckClearanceStatusRequest>
                  </soap:Body>
                </soap:Envelope>
      responses:
        '200':
          description: SOAP Response Envelope berisi status bebas pustaka
          content:
            text/xml; charset=utf-8:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:m="http://sipus.del.ac.id/soap/clearance">
                    <soap:Header>
                      <m:ProviderInfo>SIPUS-Del Legacy SOAP Engine v1.0</m:ProviderInfo>
                    </soap:Header>
                    <soap:Body>
                      <m:CheckClearanceStatusResponse>
                        <m:nim_peminjam>12S24015</m:nim_peminjam>
                        <m:active_loans>0</m:active_loans>
                        <m:is_cleared>true</m:is_cleared>
                      </m:CheckClearanceStatusResponse>
                    </soap:Body>
                  </soap:Envelope>
        '500':
          description: SOAP Fault jika body kosong, XML cacat, elemen nim hilang, atau NIM tidak terdaftar
          content:
            text/xml; charset=utf-8:
              schema:
                type: string
                example: |
                  <?xml version="1.0" encoding="UTF-8"?>
                  <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
                    <soap:Body>
                      <soap:Fault>
                        <faultcode>soap:Client</faultcode>
                        <faultstring>NIM '99S99999' tidak terdaftar di sistem perpustakaan.</faultstring>
                      </soap:Fault>
                    </soap:Body>
                  </soap:Envelope>

  /auth/login:
    post:
      tags:
        - Autentikasi
      summary: Login Kredensial Pustakawan & Penerbitan Bearer Token
      description: Memverifikasi email dan password. Hanya pengguna dengan peran 'admin' yang dapat menerbitkan token. Dibatasi rate limiting 5 percobaan/menit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login berhasil, access_token diterbitkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'

  /auth/me:
    get:
      tags:
        - Autentikasi
      summary: Profil Pemilik Token Aktif
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profil pemilik token berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Profil pemilik token aktif berhasil diambil." }
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      name: { type: string, example: "Pustakawan Del" }
                      email: { type: string, example: "pustakawan@del.ac.id" }
                      role: { type: string, example: "admin" }
                      nim: { type: string, nullable: true, example: null }
        '401':
          $ref: '#/components/responses/Problem401'

  /auth/logout:
    post:
      tags:
        - Autentikasi
      summary: Pencabutan (Revocation) Bearer Token Aktif
      description: Menghapus token yang sedang digunakan dari basis data tanpa mempengaruhi token perangkat lain milik pengguna yang sama.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token berhasil dicabut, sesi API diakhiri
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Bearer Token berhasil dicabut (revoked). Sesi API diakhiri." }
                  data: { type: null, example: null }
        '401':
          $ref: '#/components/responses/Problem401'

  /bukus:
    get:
      tags:
        - Katalog Buku
      summary: Daftar Koleksi Buku Terpaginasi (Publik)
      description: Mendukung pencarian teks (search), filter kategori (kategori_id), filter stok tersedia (tersedia=1), pengurutan whitelist (sort=judul|penulis|tahun_terbit|stok|created_at & dir=asc|desc), serta tautan navigasi HATEOAS. Bebas N+1 query.
      parameters:
        - name: search
          in: query
          description: Pencarian parsial pada judul, penulis, atau ISBN
          schema: { type: string, example: "Clean Code" }
        - name: kategori_id
          in: query
          description: Filter berdasarkan ID kategori buku
          schema: { type: integer, example: 1 }
        - name: tersedia
          in: query
          description: Filter buku dengan stok > 0
          schema: { type: boolean, example: true }
        - name: sort
          in: query
          description: Kolom pengurutan (judul, penulis, tahun_terbit, stok, created_at)
          schema: { type: string, enum: [judul, penulis, tahun_terbit, stok, created_at], default: judul }
        - name: dir
          in: query
          description: Arah pengurutan (asc, desc)
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: per_page
          in: query
          description: Jumlah item per halaman (1-50)
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: page
          in: query
          description: Nomor halaman
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Koleksi buku berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Daftar koleksi buku berhasil diambil." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Buku'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Katalog Buku
      summary: Menambah Buku Baru ke Katalog (Admin Only)
      description: Wajib menyertakan Bearer Token admin. Mengembalikan status 201 Created beserta header Location menuju URI buku baru.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat
          headers:
            Location:
              description: URI detail resource buku yang baru dibuat
              schema: { type: string, example: "http://localhost:8000/api/v1/bukus/21" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Buku baru berhasil ditambahkan." }
                  data:
                    $ref: '#/components/schemas/Buku'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'

  /bukus/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID integer unik buku
        schema: { type: integer, example: 1 }

    get:
      tags:
        - Katalog Buku
      summary: Detail Satu Buku & Riwayat Peminjaman (Publik)
      description: Mengambil data lengkap satu buku beserta kategori dan riwayat peminjaman dengan penyamaran NIM (anonymized) demi privasi mahasiswa.
      responses:
        '200':
          description: Detail buku ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Detail buku berhasil ditemukan." }
                  data:
                    $ref: '#/components/schemas/Buku'
        '404':
          $ref: '#/components/responses/Problem404'

    put:
      tags:
        - Katalog Buku
      summary: Mengganti Seluruh Representasi Buku (PUT Full Replacement)
      description: Membutuhkan token admin. Seluruh atribut representasi wajib disertakan. Field nullable yang tidak disertakan akan direset menjadi null.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Seluruh representasi buku berhasil diganti
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Seluruh representasi buku berhasil diganti (PUT)." }
                  data:
                    $ref: '#/components/schemas/Buku'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'

    patch:
      tags:
        - Katalog Buku
      summary: Memperbarui Sebagian Atribut Buku (PATCH Partial Update)
      description: Membutuhkan token admin. Hanya memvalidasi dan memperbarui atribut yang dikirimkan. Request dengan payload kosong menghasilkan 400 Bad Request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuPatch'
      responses:
        '200':
          description: Atribut buku berhasil diperbarui sebagian
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Atribut buku berhasil diperbarui sebagian (PATCH)." }
                  data:
                    $ref: '#/components/schemas/Buku'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'

    delete:
      tags:
        - Katalog Buku
      summary: Menghapus Buku dari Katalog (Admin Only)
      description: Menolak penghapusan dengan 409 Conflict jika buku memiliki peminjaman aktif atau riwayat transaksi. Mengembalikan 204 No Content jika berhasil.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Buku berhasil dihapus tanpa body kembalian
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

  /bukus/{id}/referensi-eksternal:
    parameters:
      - name: id
        in: path
        required: true
        description: ID buku lokal di perpustakaan
        schema: { type: integer, example: 1 }
    get:
      tags:
        - Konsumer Eksternal
      summary: Pengayaan Metadata Buku via OpenLibrary REST API (Publik)
      description: Bertindak sebagai Service Consumer ke API OpenLibrary dengan Http Client Laravel. Menyediakan mekanisme caching 1 jam, timeout 8 detik, dan graceful error fallback (502/504).
      responses:
        '200':
          description: Data metadata eksternal berhasil diperoleh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferensiEksternal'
        '404':
          $ref: '#/components/responses/Problem404'
        '502':
          $ref: '#/components/responses/Problem502'
        '504':
          $ref: '#/components/responses/Problem504'

  /peminjamans:
    get:
      tags:
        - Sirkulasi Peminjaman
      summary: Daftar Transaksi Peminjaman Terpaginasi (Admin Only)
      description: Menampilkan riwayat transaksi sirkulasi dengan filter status ('dipinjam' atau 'dikembalikan') dan NIM peminjam. Bebas N+1 query.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter status peminjaman (hanya 'dipinjam' atau 'dikembalikan')
          schema: { type: string, enum: [dipinjam, dikembalikan] }
        - name: nim
          in: query
          description: Filter berdasarkan NIM mahasiswa peminjam
          schema: { type: string, example: "12S24015" }
        - name: per_page
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Koleksi peminjaman berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Daftar transaksi peminjaman berhasil diambil." }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Peminjaman'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'

    post:
      tags:
        - Sirkulasi Peminjaman
      summary: Pencatatan Peminjaman Buku Baru (ACID + lockForUpdate)
      description: Mengekspos transaksi sirkulasi atomik di dalam DB::transaction() dengan pessimistic row locking. Menegakkan aturan integritas (stok, duplikasi, limit pinjaman, tunggakan denda, overdues). Menerbitkan 201 Created + Header Location.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeminjamanInput'
      responses:
        '201':
          description: Peminjaman berhasil dicatat
          headers:
            Location:
              description: URI detail peminjaman yang baru dibuat
              schema: { type: string, example: "http://localhost:8000/api/v1/peminjamans/5" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Peminjaman buku 'Clean Code' berhasil dicatat." }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'

  /peminjamans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID integer transaksi peminjaman
        schema: { type: integer, example: 1 }
    get:
      tags:
        - Sirkulasi Peminjaman
      summary: Detail Satu Transaksi Peminjaman (Admin Only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detail peminjaman berhasil ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Detail data peminjaman berhasil ditemukan." }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'

  /peminjamans/{id}/kembalikan:
    parameters:
      - name: id
        in: path
        required: true
        description: ID integer transaksi peminjaman yang akan dikembalikan
        schema: { type: integer, example: 1 }
    patch:
      tags:
        - Sirkulasi Peminjaman
      summary: Pengembalian Buku Pinjaman (ACID + lockForUpdate)
      description: Memproses pengembalian buku secara atomik di dalam DB::transaction(). Menambah stok buku (+1), menghitung denda keterlambatan berjalan, dan menandai status pengembalian. Menolak 409 Conflict jika sudah pernah dikembalikan.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pengembalian buku berhasil diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Pengembalian buku 'Clean Code' berhasil diproses." }
                  data:
                    $ref: '#/components/schemas/Peminjaman'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Masukkan Bearer Token yang diperoleh dari endpoint POST /auth/login.

  schemas:
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "pustakawan@del.ac.id" }
        password: { type: string, format: password, example: "password123" }
        device_name: { type: string, nullable: true, example: "postman-desktop" }

    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Otentikasi API berhasil." }
        data:
          type: object
          properties:
            token_type: { type: string, example: "Bearer" }
            access_token: { type: string, example: "1|abcdef123456..." }
            user:
              type: object
              properties:
                id: { type: integer, example: 1 }
                name: { type: string, example: "Pustakawan Del" }
                email: { type: string, example: "pustakawan@del.ac.id" }
                role: { type: string, example: "admin" }

    Kategori:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_kategori: { type: string, example: "IF-WEB" }
        nama_kategori: { type: string, example: "Pemrograman Web" }

    BukuInput:
      type: object
      required: [isbn, judul, penulis, penerbit, tahun_terbit, kategori_id, stok]
      properties:
        isbn: { type: string, maxLength: 20, example: "978-013-235088-4" }
        judul: { type: string, minLength: 5, maxLength: 200, example: "Clean Code: A Handbook of Agile Software Craftsmanship" }
        penulis: { type: string, maxLength: 150, example: "Robert C. Martin" }
        penerbit: { type: string, maxLength: 100, example: "Prentice Hall" }
        tahun_terbit: { type: integer, minimum: 1900, example: 2018 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, minimum: 0, example: 5 }
        sinopsis: { type: string, nullable: true, maxLength: 2000, example: "Buku standar industri penulisan kode bersih." }

    BukuPatch:
      type: object
      description: Minimal menyertakan 1 atribut yang akan diperbarui
      properties:
        isbn: { type: string, maxLength: 20, example: "978-013-235088-4" }
        judul: { type: string, minLength: 5, maxLength: 200, example: "Clean Code (Revisi)" }
        penulis: { type: string, maxLength: 150, example: "Robert C. Martin" }
        penerbit: { type: string, maxLength: 100, example: "Prentice Hall" }
        tahun_terbit: { type: integer, minimum: 1900, example: 2020 }
        kategori_id: { type: integer, example: 1 }
        stok: { type: integer, minimum: 0, example: 8 }
        sinopsis: { type: string, nullable: true, maxLength: 2000, example: "Sinopsis baru." }

    Buku:
      type: object
      properties:
        id: { type: integer, example: 1 }
        isbn: { type: string, example: "978-013-235088-4" }
        judul: { type: string, example: "Clean Code" }
        penulis: { type: string, example: "Robert C. Martin" }
        penerbit: { type: string, example: "Prentice Hall" }
        tahun_terbit: { type: integer, example: 2018 }
        stok: { type: integer, example: 4 }
        status_stok: { type: string, enum: [tersedia, menipis, habis], example: "tersedia" }
        sinopsis: { type: string, nullable: true, example: "Panduan menulis kode bersih." }
        kategori:
          $ref: '#/components/schemas/Kategori'
        total_peminjaman: { type: integer, example: 2 }
        riwayat_peminjaman:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 1 }
              kode_pinjam: { type: string, example: "PJM-20261109-ABCDEF" }
              tanggal_pinjam: { type: string, format: date, example: "2026-11-01" }
              jatuh_tempo: { type: string, format: date, example: "2026-11-08" }
              tanggal_kembali: { type: string, format: date, nullable: true, example: null }
              status: { type: string, example: "dipinjam" }
              nim_tersamar: { type: string, example: "12S24***" }
        created_at: { type: string, format: date-time, example: "2026-11-06T15:00:00Z" }
        updated_at: { type: string, format: date-time, example: "2026-11-06T15:00:00Z" }
        _links:
          $ref: '#/components/schemas/Links'

    PeminjamanInput:
      type: object
      required: [buku_id, nim_peminjam, nama_peminjam, durasi_hari]
      properties:
        buku_id: { type: integer, example: 1 }
        nim_peminjam: { type: string, pattern: "^[0-9]{2}[A-Za-z]{1,3}[0-9]{3,5}$", example: "12S24015" }
        nama_peminjam: { type: string, maxLength: 150, example: "Lucas Pardede" }
        durasi_hari: { type: integer, minimum: 1, maximum: 30, example: 7 }

    Peminjaman:
      type: object
      properties:
        id: { type: integer, example: 1 }
        kode_pinjam: { type: string, example: "PJM-20261109-1A2B3C" }
        status: { type: string, enum: [dipinjam, dikembalikan], example: "dipinjam" }
        tanggal_pinjam: { type: string, format: date, example: "2026-11-09" }
        jatuh_tempo: { type: string, format: date, example: "2026-11-16" }
        tanggal_kembali: { type: string, format: date, nullable: true, example: null }
        perpanjangan: { type: integer, example: 0 }
        hari_terlambat: { type: integer, example: 0 }
        denda: { type: integer, example: 0 }
        denda_lunas: { type: boolean, example: true }
        buku:
          type: object
          properties:
            id: { type: integer, example: 1 }
            isbn: { type: string, example: "978-013-235088-4" }
            judul: { type: string, example: "Clean Code" }
            penulis: { type: string, example: "Robert C. Martin" }
            kategori: { type: string, example: "Pemrograman Web" }
        peminjam:
          type: object
          properties:
            nim: { type: string, example: "12S24015" }
            nama: { type: string, example: "Lucas Pardede" }
        created_at: { type: string, format: date-time, example: "2026-11-09T12:00:00Z" }
        _links:
          $ref: '#/components/schemas/Links'

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 10 }
        total_items: { type: integer, example: 25 }
        total_pages: { type: integer, example: 3 }
        links:
          type: object
          properties:
            first: { type: string, example: "http://localhost:8000/api/v1/bukus?page=1" }
            prev: { type: string, nullable: true, example: null }
            next: { type: string, nullable: true, example: "http://localhost:8000/api/v1/bukus?page=2" }
            last: { type: string, example: "http://localhost:8000/api/v1/bukus?page=3" }

    Links:
      type: object
      additionalProperties:
        type: object
        properties:
          href: { type: string, example: "http://localhost:8000/api/v1/bukus/1" }
          method: { type: string, example: "GET" }

    Problem:
      type: object
      description: Standar IETF RFC 7807 Problem Details
      properties:
        type: { type: string, format: uri, example: "http://localhost:8000/docs/errors/general-error" }
        title: { type: string, example: "Internal Server Error" }
        status: { type: integer, example: 500 }
        detail: { type: string, example: "Terjadi kesalahan internal pada server." }
        instance: { type: string, example: "/api/v1/bukus" }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example:
                isbn: ["ISBN wajib diisi."]
                judul: ["Judul buku minimal harus 5 karakter."]

    ReferensiEksternal:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: "Data referensi buku eksternal berhasil diambil dari OpenLibrary." }
        data:
          type: object
          properties:
            buku_lokal:
              type: object
              properties:
                id: { type: integer, example: 1 }
                isbn: { type: string, example: "978-013-235088-4" }
                judul: { type: string, example: "Clean Code" }
                penulis: { type: string, example: "Robert C. Martin" }
                stok: { type: integer, example: 4 }
            referensi_eksternal:
              type: object
              properties:
                judul_eksternal: { type: string, nullable: true, example: "Clean Code" }
                penerbit: { type: string, nullable: true, example: "Prentice Hall" }
                jumlah_halaman: { type: integer, nullable: true, example: 431 }
                tanggal_terbit: { type: string, nullable: true, example: "July 2008" }
                url_pratinjau: { type: string, nullable: true, example: "https://openlibrary.org/books/OL26222911M/Clean_Code" }
                sumber: { type: string, example: "OpenLibrary" }

  responses:
    Problem400:
      description: Bad Request (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/empty-patch-payload"
            title: "Bad Request"
            status: 400
            detail: "Permintaan PATCH wajib menyertakan minimal satu atribut yang ingin diperbarui."
            instance: "/api/v1/bukus/1"

    Problem401:
      description: Unauthorized (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/unauthenticated"
            title: "Unauthorized"
            status: 401
            detail: "Akses ditolak. Sertakan Bearer Token yang valid pada header Authorization."
            instance: "/api/v1/bukus"

    Problem403:
      description: Forbidden (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "Akses ditolak: Operasi ini hanya diizinkan untuk peran admin/pustakawan."
            instance: "/api/v1/bukus"

    Problem404:
      description: Not Found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/book-not-found"
            title: "Resource Not Found"
            status: 404
            detail: "Buku dengan ID '99999' tidak ditemukan di katalog perpustakaan."
            instance: "/api/v1/bukus/99999"

    Problem405:
      description: Method Not Allowed (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/method-not-allowed"
            title: "Method Not Allowed"
            status: 405
            detail: "Metode HTTP 'DELETE' tidak diizinkan untuk endpoint ini."
            instance: "/api/v1/bukus"

    Problem409:
      description: Conflict (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/book-has-active-loans"
            title: "Conflict — Book Has Active Loans"
            status: 409
            detail: "Buku 'Clean Code' tidak dapat dihapus karena masih sedang dipinjam secara aktif oleh 1 mahasiswa."
            instance: "/api/v1/bukus/1"

    Problem422:
      description: Unprocessable Content (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: "http://localhost:8000/docs/errors/validation-failed"
            title: "Unprocessable Content"
            status: 422
            detail: "Satu atau lebih atribut input yang dikirim tidak memenuhi aturan validasi."
            instance: "/api/v1/bukus"
            errors:
              isbn: ["ISBN wajib diisi."]
              judul: ["Judul buku minimal harus 5 karakter."]

    Problem429:
      description: Too Many Requests (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/too-many-requests"
            title: "Too Many Requests"
            status: 429
            detail: "Terlalu banyak permintaan dalam waktu singkat. Silakan tunggu beberapa saat."
            instance: "/api/v1/auth/login"

    Problem502:
      description: Bad Gateway (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/external-service-error"
            title: "Bad Gateway"
            status: 502
            detail: "Layanan eksternal OpenLibrary merespons dengan kesalahan."
            instance: "/api/v1/bukus/1/referensi-eksternal"

    Problem504:
      description: Gateway Timeout (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "http://localhost:8000/docs/errors/external-service-timeout"
            title: "Gateway Timeout"
            status: 504
            detail: "Batas waktu komunikasi dengan layanan OpenLibrary telah habis (timeout)."
            instance: "/api/v1/bukus/1/referensi-eksternal"
